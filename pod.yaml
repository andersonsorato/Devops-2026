apiVersion: v1
kind: Service
metadata:
  name: svc-aula-06-11
spec:
  type: NodePort
  selector:
    aplicacao: web
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30001
---
apiVersion: v1
kind: Pod
metadata:
  name: aula-06-11
  labels:
    aplicacao: web
spec:
  containers:
    - image: nginx
      name: web
      ports:
        - containerPort: 80
      command: ["nginx", "-g", "daemon off;"]
