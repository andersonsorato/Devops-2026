apiVersion: v1
kind: Service
metadata:
  name: svc-aula-06-11
spec:
  type: NodePort
  selector:
    aplicacao: web
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30000
---
apiVersion: v1
kind: Pod
metadata:
  name: aula-06-11
  labels:
    aplicacao: web
spec:
  containers:
    - image: andersonsorato/tarefas:2.0
      name: web
      ports:
        - containerPort: 8000
      env:
        - name: DATABASE
          value: devops
        - name: DATABASE_PASSWORD 
          value: password
        - name: DATABASE_ADDRESS
          value: svc-banco.default.svc.cluster.local
        - name: DATABASE_USERNAME
          value: devops
---
apiVersion: v1
kind: Service
metadata:
  name: svc-banco
spec:
  selector:
    aplicacao: banco
  ports:
    - name: sql
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Pod
metadata:
  name: banco
  labels:
    aplicacao: banco
spec:
  containers:
    - name: postgres
      image: postgres
      env:
        - name: POSTGRES_USER
          value: devops
        - name: POSTGRES_PASSWORD
          value: password
        - name: POSTGRES_DB
          value: devops
      ports:
        - containerPort: 5432